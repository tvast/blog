# Carried over from the Gatsby siteMetadata so the two builds describe the
# same site. `url` + `baseurl` reproduce Gatsby's siteUrl of
# https://tvast.github.io/blog (a GitHub Pages project site, hence the
# /blog path prefix).
title: A developer journey
author: Theophile Vast
description: Journey of a front end developer in the digital world
url: https://tvast.github.io
baseurl: /blog
lang: en

# Build to docs/ for GitHub Pages /docs deployment
destination: ./docs

social:
  - name: twitter
    url: https://twitter.com/theophile_vast
  - name: github
    url: https://github.com/tvast

# --- Theme -------------------------------------------------------------------
dracula_knowledge:
  collection: knowledge
  index_path: /assets/search-index.json
  sidebar_title: Knowledge
  author: Theophile Vast
  # Indexing excerpts makes search-index.json roughly 4x larger. Off by default.
  excerpts: false
  # Password protect the knowledge base (leave empty to disable)
  password: "knowledge123"
  nav:
    - title: Home
      url: /
    - title: Knowledge
      url: /knowledge/

collections:
  knowledge:
    output: true
    permalink: /knowledge/:path/

defaults:
  - scope:
      path: ""
      type: knowledge
    values:
      layout: knowledge-doc
      # Imported notes are documents, not templates. Many legitimately contain
      # {{ ... }} and {% ... %} in code samples, which Jekyll would otherwise
      # try to execute as Liquid and fail on.
      render_with_liquid: false
  - scope:
      path: ""
      type: posts
    values:
      layout: post

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - ./lib/jekyll-theme-dracula-knowledge

sass:
  style: compressed

exclude:
  # Skill templates whose front matter holds placeholders ("date: {{DATE}}")
  # rather than values; Jekyll refuses to parse those as documents.
  - _knowledge/plugins/plugins/hugging-face/skills/paper-publisher/templates
  - Gemfile
  - Gemfile.lock
  - "*.gemspec"
  - vendor
  - node_modules
  - README.md
  - LICENSE.txt
