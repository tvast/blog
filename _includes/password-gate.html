<div id="dk-password-gate" class="dk-password-gate" hidden>
  <div class="dk-password-box">
    <h1>🔐 Knowledge Base</h1>
    <p>This knowledge base is password protected.</p>
    <form id="dk-password-form" onsubmit="handlePasswordSubmit(event)">
      <input
        type="password"
        id="dk-password-input"
        placeholder="Enter password"
        autocomplete="off"
        autofocus
      />
      <button type="submit">Access</button>
    </form>
    <p id="dk-password-error" class="dk-password-error" hidden>
      Incorrect password. Try again.
    </p>
  </div>
</div>

<script>
  (function () {
    // Configure password here
    var KNOWLEDGE_PASSWORD = "{{ site.dracula_knowledge.password }}";

    if (!KNOWLEDGE_PASSWORD) return; // No password set, skip protection

    // Only protect /knowledge/* routes, allow home page public access
    var isKnowledgePage = window.location.pathname.includes("/knowledge/");

    if (!isKnowledgePage) return; // Not a knowledge page, no gate needed

    var gate = document.getElementById("dk-password-gate");
    var form = document.getElementById("dk-password-form");
    var input = document.getElementById("dk-password-input");
    var errorMsg = document.getElementById("dk-password-error");

    function checkAuth() {
      try {
        // Check both localStorage (persistent) and sessionStorage (session-only)
        var stored = localStorage.getItem("dk-auth") || sessionStorage.getItem("dk-auth");
        return stored === KNOWLEDGE_PASSWORD;
      } catch (e) {
        return false;
      }
    }

    function grantAccess() {
      try {
        // Store in localStorage for persistent access across browser sessions
        localStorage.setItem("dk-auth", KNOWLEDGE_PASSWORD);
        // Also store in sessionStorage as fallback
        sessionStorage.setItem("dk-auth", KNOWLEDGE_PASSWORD);
      } catch (e) {}
      gate.hidden = true;
    }

    // Show gate only if not authenticated AND on knowledge page
    if (!checkAuth()) {
      gate.hidden = false;
      document.body.style.overflow = "hidden";
    }

    window.handlePasswordSubmit = function (e) {
      e.preventDefault();
      if (input.value === KNOWLEDGE_PASSWORD) {
        errorMsg.hidden = true;
        grantAccess();
        document.body.style.overflow = "auto";
      } else {
        errorMsg.hidden = false;
        input.value = "";
        input.focus();
      }
    };
  })();
</script>
