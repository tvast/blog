<footer class="dk-footer">
  {%- if site.social %}
    <p class="dk-social">
      {%- for link in site.social %}
        <a href="{{ link.url }}" rel="me noopener">{{ link.name }}</a>
      {%- endfor %}
    </p>
  {%- endif %}

  <p>
    © {{ site.time | date: "%Y" }} {{ site.author | default: site.title }}
    · Built with Jekyll ·
    <a href="https://draculatheme.com/">Dracula</a>
  </p>
</footer>
