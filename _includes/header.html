<header class="dk-header">
  <button
    type="button"
    class="dk-iconbtn dk-sidebar-toggle"
    data-dk-sidebar-toggle
    aria-label="Toggle navigation"
    aria-expanded="false"
    aria-controls="dk-sidebar">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3 6h18M3 12h18M3 18h18" />
    </svg>
  </button>

  <a class="dk-header__brand" href="{{ '/' | relative_url }}">
    {%- if site.dracula_knowledge.logo %}
      <img src="{{ site.dracula_knowledge.logo | relative_url }}" alt="" width="24" height="24">
    {%- endif %}
    {{ site.title | default: "Knowledge" }}
  </a>

  <div class="dk-header__spacer"></div>

  <button type="button" class="dk-searchbtn" data-dk-search-open>
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="11" cy="11" r="7" />
      <path d="M20 20l-3.5-3.5" />
    </svg>
    <span>Search…</span>
    <kbd data-dk-kbd>⌘K</kbd>
  </button>

  <nav class="dk-header__nav" aria-label="Main">
    {%- for item in site.dracula_knowledge.nav %}
      <a href="{{ item.url | relative_url }}"
         {% if page.url == item.url %}aria-current="page"{% endif %}>{{ item.title }}</a>
    {%- endfor %}
  </nav>

  <button
    type="button"
    class="dk-iconbtn"
    data-dk-theme-toggle
    aria-label="Switch colour theme">
    <svg viewBox="0 0 24 24" aria-hidden="true" data-dk-icon-dark>
      <path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" />
    </svg>
    <svg viewBox="0 0 24 24" aria-hidden="true" data-dk-icon-light hidden>
      <circle cx="12" cy="12" r="4.5" />
      <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" />
    </svg>
  </button>
</header>
