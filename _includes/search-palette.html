<div class="dk-palette" data-dk-palette hidden>
  <div
    class="dk-palette__box"
    role="dialog"
    aria-modal="true"
    aria-label="Search the knowledge base">
    <label class="dk-visually-hidden" for="dk-palette-input">Search</label>
    <input
      type="search"
      id="dk-palette-input"
      class="dk-palette__input"
      placeholder="Search {{ site.dk_total | default: 'the knowledge base' }}{% if site.dk_total %} documents{% endif %}…"
      autocomplete="off"
      spellcheck="false"
      role="combobox"
      aria-expanded="false"
      aria-controls="dk-palette-results"
      aria-autocomplete="list"
      data-dk-palette-input>

    <ul class="dk-palette__results" id="dk-palette-results" role="listbox" data-dk-palette-results></ul>
    <p class="dk-palette__empty" data-dk-palette-empty hidden>No matches.</p>

    <div class="dk-palette__hint">
      <span><kbd>↑</kbd> <kbd>↓</kbd> navigate</span>
      <span><kbd>↵</kbd> open</span>
      <span><kbd>esc</kbd> close</span>
    </div>
  </div>
</div>
